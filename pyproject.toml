[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aoseye"
version = "1.0.0"
description = "Android APK static security analyzer"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
  "androguard>=4.1,<5",
]

[project.scripts]
aoseye = "aoseye.cli:main"

[tool.setuptools.packages.find]
include = ["aoseye*"]
